name: Horizon | Runtime regression checks

on:
  push:
    branches: [main]
    paths:
      - 'server.mjs'
      - 'maestro/embedded-postgres.mjs'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.github/workflows/horizon-runtime-tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate Node runtime syntax
        run: |
          node --check server.mjs
          node --check maestro/embedded-postgres.mjs
      - name: Run application and supervisor regression tests
        run: npm test
      - name: Build and smoke-test the Coolify image
        if: github.event_name == 'pull_request'
        run: |
          set -e
          docker build --progress=plain -t horizon-central-ci:latest .
          docker run -d --rm --name horizon-central-ci -p 127.0.0.1:33991:3000 horizon-central-ci:latest
          trap 'docker stop horizon-central-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 3 http://127.0.0.1:33991/health | grep -q '"status":"ok"'; then
              curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:33991/central/
              echo 'Coolify image ready: /health and /central/'
              exit 0
            fi
            sleep 1
          done
          docker logs horizon-central-ci || true
          echo 'Coolify image did not pass smoke test'
          exit 1
