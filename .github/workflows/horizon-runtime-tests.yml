name: Horizon | Runtime regression checks

on:
  push:
    branches: [main]
    paths:
      - 'server.mjs'
      - 'maestro/embedded-postgres.mjs'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/horizon-runtime-tests.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate Node runtime syntax
        run: |
          node --check server.mjs
          node --check maestro/embedded-postgres.mjs
      - name: Run application and supervisor regression tests
        run: npm test
