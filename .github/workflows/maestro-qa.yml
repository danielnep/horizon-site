name: May Maestro Runtime QA
on:
  pull_request:
    paths:
      - 'server.mjs'
      - 'maestro-worker.mjs'
      - 'package.json'
      - 'tests/**'
      - 'maestro/**'
      - '.github/workflows/maestro-qa.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check server.mjs
      - name: Install Node dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Tests (without provider calls)
        run: npm test
      - name: Python host supervisor regression
        run: python3 -m unittest discover -s tests -p 'test_railway_team.py'
