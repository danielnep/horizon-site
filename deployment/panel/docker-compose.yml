name: horizon-orbita
services:
  painel:
    container_name: horizon-orbita-painel
    build:
      context: ../..
    restart: unless-stopped
    init: true
    env_file:
      - /etc/horizon-site-control.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HORIZON_PANEL_ONLY: "true"
      HORIZON_LEGACY_WORKER_EXPLICIT_OPT_IN: "false"
      HORIZON_VPS_API_SOCKET: /run/horizon-central/control.sock
    group_add:
      - "987"
    volumes:
      - /run/horizon-central:/run/horizon-central:ro
    networks:
      coolify:
        aliases:
          - horizon-orbita-painel
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/central/"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  coolify:
    external: true
