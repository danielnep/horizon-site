# Traefik Coolify: apex and www use independent TLS certificates.
# This allows apex HTTPS to activate as soon as its A record points to the VPS.
http:
  routers:
    horizon-apex-http:
      entryPoints: [http]
      rule: "Host(`horizonsolucoes.com`)"
      middlewares: [redirect-to-https]
      service: horizon-site-web
    horizon-apex-https:
      entryPoints: [https]
      rule: "Host(`horizonsolucoes.com`)"
      middlewares: [gzip]
      service: horizon-site-web
      tls:
        certResolver: letsencrypt
    horizon-www-http:
      entryPoints: [http]
      rule: "Host(`www.horizonsolucoes.com`)"
      middlewares: [redirect-to-https]
      service: horizon-site-web
    horizon-www-https:
      entryPoints: [https]
      rule: "Host(`www.horizonsolucoes.com`)"
      middlewares: [gzip]
      service: horizon-site-web
      tls:
        certResolver: letsencrypt
  services:
    horizon-site-web:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://horizon-site-web:3000"
